<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="PQ-Chat protocol: out-of-band contact card, hybrid handshake, post-quantum double ratchet" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="920" height="330" rx="14" fill="#050505"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00E5FF"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B388FF"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker>
  </defs>
  <g fill="#121212" stroke="#2c2c2c">
    <rect x="60" y="20" width="150" height="36" rx="9"/>
    <rect x="710" y="20" width="150" height="36" rx="9"/>
  </g>
  <g fill="#e5e5e5" font-size="13" text-anchor="middle" font-weight="600">
    <text x="135" y="43">Alice (initiator)</text>
    <text x="785" y="43">Bob (responder)</text>
  </g>
  <g stroke="#2c2c2c" stroke-width="1.200">
    <path d="M135 56V312"/>
    <path d="M785 56V312"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <path d="M783 84H139" stroke="#6b6b6b" stroke-dasharray="5 4" stroke-width="1.200" fill="none" marker-end="url(#g)"/>
    <text x="460" y="77" fill="#9a9a9a">contact card, out-of-band: address · identity fingerprint · invite secret</text>

    <path d="M137 124H781" stroke="#00E5FF" stroke-width="1.300" fill="none" marker-end="url(#c)"/>
    <text x="460" y="117" fill="#e5e5e5">m1: one-time X-Wing public key + MAC under invite secret</text>

    <path d="M783 164H139" stroke="#00E5FF" stroke-width="1.300" fill="none" marker-end="url(#c)"/>
    <text x="460" y="157" fill="#e5e5e5">m2: X-Wing ciphertext + encrypted { identity, Ed25519 + ML-DSA-65 signature }</text>

    <path d="M137 204H781" stroke="#00E5FF" stroke-width="1.300" fill="none" marker-end="url(#c)"/>
    <text x="460" y="197" fill="#e5e5e5">m3: encrypted { identity, hybrid signature, first ratchet key }</text>

    <path d="M783 250H139" stroke="#B388FF" stroke-width="1.300" fill="none" marker-end="url(#p)"/>
    <text x="460" y="243" fill="#B388FF">KEM ratchet step: new X25519 + ML-KEM-768 key pair, encapsulate to peer</text>

    <path d="M137 290H781" stroke="#B388FF" stroke-width="1.300" fill="none" marker-end="url(#p)"/>
    <text x="460" y="283" fill="#B388FF">KEM ratchet step in the other direction · a new key for every message in between</text>
  </g>
  <g font-size="10.500" fill="#6b6b6b">
    <text x="20" y="168">handshake</text>
    <text x="20" y="274">ratchet</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
